<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Gemini Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars"></div>

    <div id="auth-container">
        <div class="moon">🌙</div>
        <h1>Gemini Journal</h1>
        <p>A quiet place to think out loud.</p>
        <button id="login-btn">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.79 2.73v2.27h2.9c1.7-1.56 2.69-3.87 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.27c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.99v2.34C2.47 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 013.68 9c0-.59.1-1.16.27-1.69V4.97H.99A9 9 0 000 9c0 1.45.35 2.83.99 4.03l2.96-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.47 2.02.99 4.97l2.96 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
            Sign in with Google
        </button>
    </div>

    <div id="app-container" class="hidden">
        <!-- Sidebar: conversation history -->
        <aside id="sidebar">
            <button id="new-chat-btn">+ New Chat</button>
            <div id="conversation-list"></div>
        </aside>

        <div id="main-panel">
            <header>
                <div class="header-left">
                    <button id="sidebar-toggle" title="Chat history">☰</button>
                    <span class="sparkle">✦</span>
                    <div>
                        <div class="header-title">Gemini Journal</div>
                        <span id="user-email"></span>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="search-toggle" title="Search entries">🔍</button>
                    <button id="export-btn" title="Export journal">⬇</button>
                    <button id="logout-btn">Logout</button>
                </div>
            </header>

            <div id="search-bar" class="hidden">
                <input type="text" id="search-input" placeholder="Search your past entries...">
            </div>

            <main id="chat-box">
                <div id="empty-state">
                    <div class="empty-icon">🪶</div>
                    <p>Your journal is empty. Start writing, and Gemini will listen.</p>
                </div>
            </main>

            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Reflect on your day..." required autocomplete="off">
                <button type="submit" id="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11L21 3L13 21L11 13L3 11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
